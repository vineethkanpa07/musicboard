<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

            <radialGradient id="vinylNebula" cx="70%" cy="72%" r="45%">

              <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>

          </defs>
          <circle class="disc" cx="50" cy="50" r="50"/>
          <g class="grooves" fill="none"><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="39"/><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="29"/></g>
