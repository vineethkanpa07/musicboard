<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musicboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Musicboard</h1>
        <p id="summary">Every album you've played, scored track by track.</p>
      </div>
      <div class="top-actions">
        <button class="btn" id="arrangeBtn" type="button" hidden>Arrange</button>
        <button class="plus-btn" id="addAlbumBtn" type="button" aria-label="Add album" title="Add album">+</button>
      </div>
    </header>
    <div class="scale" aria-label="Rating colors from 1 to 10">
      <span>Scale</span>
      <div class="scale-cells" id="scaleCells"></div>
      <span class="status" id="status">Loading your albums…</span>
    </div>
    <main id="shelves" class="shelves"></main>
  </div>
  <input type="file" id="coverFile" accept="image/*" hidden>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
