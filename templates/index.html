<!doctype html>
<html lang="en">
<head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">

          <defs><linearGradient id="vinylLabel" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="hsl(2 72% 50%)"/><stop offset=".5" stop-color="hsl(55 72% 54%)"/><stop offset="1" stop-color="hsl(130 72% 50%)"/>

          <path class="shine" d="M50 8 A42 42 0 0 1 86 29" fill="none"/>
